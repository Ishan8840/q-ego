[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-q"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["opencv-contrib-python>=4.10,<6", "numpy>=2", "pydantic>=2.8,<3", "PyYAML>=6"]

[project.optional-dependencies]
ollama = ["httpx>=0.27,<1"]
datasets = ["h5py>=3.11,<4"]
hands = ["mediapipe>=0.10.30,<0.11"]
vlm = ["openai>=2,<3"]
models = ["mediapipe>=0.10.30,<0.11", "openai>=2,<3"]
test = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["qc*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
