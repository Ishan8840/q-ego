name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libegl1
      - run: python -m pip install -e '.[models,ollama,datasets,test]'
      - run: ruff check .
      - run: python -m pytest -q
